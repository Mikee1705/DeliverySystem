<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
</head>

<body>
    <h1>Welcome to QuickBites</h1>
    <h3>Create Account</h3>
    <form action="../php/redirect.php" method="POST" id="registrationForm">
        <fieldset>
            <legend>Information</legend>
            <label for="email">Email: </label>
            <input type="text" name="email" required><br>
            <label for="password">Password: </label>
            <input type="password" name="password" id="password" required><br>
            <label for="password">Enter Password again: </label>
            <input type="password" id="confirm_password" required><br>
        </fieldset>

        <fieldset name="acc_types">
            <legend>Account Type</legend>
            <input type="radio" name="account_type" id="" value="Customer">Customer</input> <br>
            <input type="radio" name="account_type" id="" value="Vendor">Vendor</input> <br>
            <input type="radio" name="account_type" id="" value="Rider">Rider</input> <br>
        </fieldset>
        <br>
        <button type="submit">Submit</button>
    </form>
    <br>
    <a href="signIn.html">Already have an account? Sign in here</a>
</body>

<script>
    // Validate password confirmation in real time and on submit
    (function () {
        const form = document.getElementById('registrationForm');
        const pwd = document.getElementById('password');
        const confirm = document.getElementById('confirm_password');

        // Update validity message as user types
        function validateMatch() {
            if (confirm.value === '') {
                confirm.setCustomValidity(''); // let required handle emptiness
            } else if (pwd.value !== confirm.value) {
                confirm.setCustomValidity('Passwords do not match');
            } else {
                confirm.setCustomValidity('');
            }
        }

        pwd.addEventListener('input', validateMatch);
        confirm.addEventListener('input', validateMatch);

        // Extra guard on submit (prevents bypass)
        form.addEventListener('submit', function (e) {
            validateMatch();
            if (!form.checkValidity()) {
                e.preventDefault();
                form.reportValidity();
            }
        });
    })();
    </script>

</html>
