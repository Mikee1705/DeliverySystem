<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
</head>

<body>
    <h1>Welcome to QuickBites</h1>
    <h3>Create Account</h3>
    <form action="../php/redirect.php" method="POST">
        <fieldset>
            <legend>Information</legend>
            <label for="email">Email: </label>
            <input type="text" name="email"><br>
            <label for="password">Password: </label>
            <input type="password" name="password"><br>
            <label for="password">Enter Password again: </label>
            <input type="password" name="password"><br>
        </fieldset>

        <fieldset name="acc_types">
            <legend>Account Type</legend>
            <input type="radio" name="account_type" id="" value="Customer">Customer</input> <br>
            <input type="radio" name="account_type" id="" value="Vendor">Vendor</input> <br>
            <input type="radio" name="account_type" id="" value="Rider">Rider</input> <br>
        </fieldset>
        <br>
        <button type="submit">Submit</button>
    </form>
    <br>
    <a href="signIn.html">Already have an account? Sign in here</a>
</body>

</html>
